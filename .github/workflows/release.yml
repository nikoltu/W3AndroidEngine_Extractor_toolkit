name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Fetch Gradle
        shell: bash
        run: for i in 1 2 3; do ./gradlew --version --no-daemon && exit 0; sleep 30; done; exit 1
      - name: Check tag matches version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(sed -n "s/^def packerVersion = '\(.*\)'/\1/p" build.gradle)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match version $version"; exit 1; }
      - name: Test and package
        run: ./gradlew test distArchive --no-daemon
      - name: Universal jar
        if: runner.os == 'Linux'
        run: ./gradlew allJar --no-daemon
      - uses: actions/upload-artifact@v6
        with:
          name: package-${{ runner.os }}
          path: |
            build/distributions/Reforged-Extractor-*
            build/distributions/*-all.jar

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: source
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n "s/^def packerVersion = '\(.*\)'/\1/p" source/build.gradle)
          tag="v${version}"
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat > notes.md <<NOTES
          Download the file for your system, unpack it anywhere and start it. No installer.

          | System | File |
          | --- | --- |
          | Windows 10/11 (64-bit) | \`Reforged-Extractor-${version}-windows-x64.zip\` |
          | macOS (Apple Silicon) | \`Reforged-Extractor-${version}-macos-arm64.zip\` |
          | Linux (x64) | \`Reforged-Extractor-${version}-linux-x64.tar.gz\` |
          | Any system with Java 17+ | \`reforged-extractor-${version}-all.jar\` |

          The tool makes \`w3-data-classic.zip\` from your own game install. Copy it to the Android device, then in Warsmash use Options › Game Data › Import ZIP and pick it; don't unpack it. See the README for the steps.

          Checksums are in \`SHA256SUMS.txt\`.

          For use with your own legal copy only. Do not share the extracted files. Contains code only, no game files.
          NOTES
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            if [ "${GITHUB_REF_NAME}" = "${tag}" ]; then
              echo "Release ${tag} is already published by an earlier run of this tag."
              exit 0
            fi
            echo "Release ${tag} already exists; raise the version first."
            exit 1
          fi
          gh release create "${tag}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --title "Reforged Extractor toolkit ${version}" --notes-file notes.md \
            Reforged-Extractor-* *-all.jar SHA256SUMS.txt
