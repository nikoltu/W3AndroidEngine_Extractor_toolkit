name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Fetch Gradle
        shell: bash
        run: for i in 1 2 3; do ./gradlew --version --no-daemon && exit 0; sleep 30; done; exit 1
      - name: Test and package
        run: ./gradlew test distArchive allJar --no-daemon
      - uses: actions/upload-artifact@v6
        with:
          name: Reforged-Extractor-${{ runner.os }}
          path: |
            build/distributions/Reforged-Extractor-*
            build/distributions/*-all.jar
